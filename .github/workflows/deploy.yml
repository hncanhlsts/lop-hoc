name: Trien khai Web Hoc Sinh len GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói thư mục client
        uses: actions/upload-pages-artifact@v3
        with:
          # Chỉ triển khai thư mục client chứa giao diện học sinh
          path: 'client'

      - name: Phát hành trang web
        id: deployment
        uses: actions/deploy-pages@v4
